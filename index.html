<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>College Result Portal</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">

  <div class="masthead">
    <div class="logo-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EDE7D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5-10-5Z"></path>
        <path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"></path>
      </svg>
    </div>
    <div>
      <h1>BCE BHAGALPUR Result Portal</h1>
      <p>Look up mid semester marks and grades by registration number.</p>
    </div>
  </div>

  <div class="lookup-card">
    <label for="roll-input">Registration number</label>
    <div class="search-row">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8368" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input type="number" id="roll-input" placeholder="e.g. 25105108001 or a student's name" autocomplete="off" />
        <div class="dropdown" id="dropdown"></div>
      </div>
      <button id="view-btn">View result</button>
    </div>
    <p id="error-msg"></p>
  </div>

  <div id="result-card"></div>
  <div id="empty-state">Enter or select a Registration number above to view a result.</div>

</div>

<script src="script.js"></script>
</body>
</html>
